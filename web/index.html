<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesh Inspection Workbench</title>
  </head>
  <body>
    <aside id="panel">
      <h1>Mesh Inspection Workbench</h1>
      <p class="sub">C++ geometry core in WebAssembly · synthetic meshes only</p>

      <section>
        <h2>Mesh</h2>
        <select id="preset" aria-label="Preset mesh"></select>
        <div class="row">
          <button type="button" class="button" id="open">Open STL / OBJ</button>
          <input type="file" id="file" accept=".stl,.obj" hidden />
          <label class="inline">weld ε <input id="weld" type="number" value="0" min="0" step="any" /></label>
        </div>
        <div class="row">
          <button type="button" class="button" id="detect">Detect cusps</button>
          <button type="button" class="button" id="open-landmarks">Load cusp landmarks</button>
          <input type="file" id="landmarks" accept=".json" hidden />
        </div>
        <div class="row">
          <button type="button" class="button" id="detect-margin">Detect margin</button>
          <button type="button" class="button" id="open-labels">Load tooth labels</button>
          <button type="button" class="button" id="undercut">Undercut (occlusal axis)</button>
          <button type="button" class="button" id="best-axis">Best path of insertion</button>
          <label class="inline">wall <input type="number" id="wall" value="0.1" min="0" step="0.05" style="width: 4.5em" /></label>
          <button type="button" class="button" id="shell-sdf">Offset shell (SDF)</button>
          <button type="button" class="button" id="shell-naive">Offset shell (naive)</button>
          <button type="button" class="button" id="thickness">Thickness map</button>
          <input type="file" id="labels" accept=".json" hidden />
        </div>
        <p class="hint">or drop a mesh on the view</p>
      </section>

      <section>
        <h2>Color</h2>
        <div class="choices" id="overlay">
          <label><input type="radio" name="overlay" value="shaded" checked /> Shaded</label>
          <label><input type="radio" name="overlay" value="mean" /> Mean curvature H</label>
          <label><input type="radio" name="overlay" value="gaussian" /> Gaussian curvature K</label>
          <label><input type="radio" name="overlay" value="kmin" /> Min principal curvature κ<sub>min</sub> (creases)</label>
          <label><input type="radio" name="overlay" value="components" /> Components</label>
          <label><input type="radio" name="overlay" value="undercut" /> Undercut (red) / reachable (green)</label>
          <label><input type="radio" name="overlay" value="thickness" /> Wall thickness (red = thinner than the wall)</label>
          <label><input type="radio" name="overlay" value="geodesic" /> Geodesic distance (click a point)</label>
        </div>
        <label class="inline-check"><input type="checkbox" id="idt" /> Intrinsic Delaunay Laplacian</label>
        <div id="legend"></div>
      </section>

      <section>
        <h2>Layers</h2>
        <div class="choices" id="layers">
          <label><input type="checkbox" value="boundary" checked /> <i data-swatch="boundary"></i> Boundary edges</label>
          <label><input type="checkbox" value="nonmanifold" checked /> <i data-swatch="nonmanifold"></i> Non-manifold edges</label>
          <label><input type="checkbox" value="misoriented" checked /> <i data-swatch="misoriented"></i> Misoriented edges</label>
          <label><input type="checkbox" value="vertices" checked /> <i data-swatch="vertices"></i> Non-manifold vertices</label>
          <label><input type="checkbox" value="handles" checked /> <i data-swatch="handles"></i> Handle loops</label>
          <label><input type="checkbox" value="cusps" checked /> <i data-swatch="cusps"></i> Cusp tips (detected) <i data-swatch="truth"></i> landmarks</label>
          <label><input type="checkbox" value="margin" checked /> <i data-swatch="margin"></i> Margin line (detected) <i data-swatch="truth"></i> labels</label>
          <label><input type="checkbox" value="wireframe" /> Wireframe</label>
        </div>
      </section>

      <p id="error" role="alert"></p>
      <div id="stats"></div>
    </aside>
    <main id="view" aria-label="3D view"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
