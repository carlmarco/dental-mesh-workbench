<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesh Inspection Workbench</title>
  </head>
  <body>
    <aside id="panel">
      <h1>Mesh Inspection Workbench</h1>
      <p class="sub">C++ geometry core in WebAssembly · synthetic meshes only</p>

      <section>
        <h2>Mesh</h2>
        <select id="preset" aria-label="Preset mesh"></select>
        <div class="row">
          <label class="button">Open STL / OBJ<input type="file" id="file" accept=".stl,.obj" hidden /></label>
          <label class="inline">weld ε <input id="weld" type="number" value="0" min="0" step="any" /></label>
        </div>
        <p class="hint">or drop a file on the view</p>
      </section>

      <section>
        <h2>Color</h2>
        <div class="choices" id="overlay">
          <label><input type="radio" name="overlay" value="shaded" checked /> Shaded</label>
          <label><input type="radio" name="overlay" value="mean" /> Mean curvature H</label>
          <label><input type="radio" name="overlay" value="gaussian" /> Gaussian curvature K</label>
          <label><input type="radio" name="overlay" value="components" /> Components</label>
          <label><input type="radio" name="overlay" value="geodesic" /> Geodesic distance (click a point)</label>
        </div>
        <label class="inline-check"><input type="checkbox" id="idt" /> Intrinsic Delaunay Laplacian</label>
        <div id="legend"></div>
      </section>

      <section>
        <h2>Layers</h2>
        <div class="choices" id="layers">
          <label><input type="checkbox" value="boundary" checked /> <i data-swatch="boundary"></i> Boundary edges</label>
          <label><input type="checkbox" value="nonmanifold" checked /> <i data-swatch="nonmanifold"></i> Non-manifold edges</label>
          <label><input type="checkbox" value="misoriented" checked /> <i data-swatch="misoriented"></i> Misoriented edges</label>
          <label><input type="checkbox" value="vertices" checked /> <i data-swatch="vertices"></i> Non-manifold vertices</label>
          <label><input type="checkbox" value="wireframe" /> Wireframe</label>
        </div>
      </section>

      <p id="error" role="alert"></p>
      <div id="stats"></div>
    </aside>
    <main id="view" aria-label="3D view"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
